name: CI/CD - Build e Deploy no Azure Container App

# Aciona o workflow em cada push para a branch 'main'
on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permite acionamento manual

# Variáveis de ambiente (lidas das "Variables" do repositório)
env:
  AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  build-e-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # 1. Configurar Java 21 (com base no pom.xml e Dockerfile)
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 2. Construir o projeto Spring Boot com Maven
      - name: Build com Maven (pulando testes)
        run: mvn clean package -DskipTests=true

      # 3. Fazer login no Azure (usando o Secret 'AZURE_CREDENTIALS')
      - name: Login no Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 4. Fazer login no Azure Container Registry (ACR)
      - name: Login no Azure Container Registry (ACR)
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}

      # 5. Configurar o Docker Buildx
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Buildar e enviar imagem Docker para o ACR
      - name: Buildar e enviar imagem Docker para o ACR
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # A tag da imagem será o SHA do commit (ex: .../jotanunes-backend:a1b2c3d4)
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 7. Fazer o deploy no Azure Container App
      - name: Deploy no Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ env.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          # Diz ao Container App para usar a nova imagem que acabamos de enviar
          imageToDeploy: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          registryUrl: ${{ env.ACR_LOGIN_SERVER }}